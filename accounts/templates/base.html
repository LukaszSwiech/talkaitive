{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TalkAItive{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'ui/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'ui/css/components.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  {% for message in messages %}
    <p class="flash {{ message.tags }}">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}

  <div id="typing-indicator" class="typing" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span role="status" id="typing-text">Agent is typing…</span>
  </div>
  <script>
    var defaultWaitingText = document.getElementById("typing-text").textContent;
    // Convenience only: forms work without JS, and the server rejects double sends.
    document.addEventListener("submit", function (event) {
      var form = event.target;
      if (form.dataset.submitted) { event.preventDefault(); return; }
      form.dataset.submitted = "1";
      // Disable after the browser has read the form data.
      setTimeout(function () {
        document.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
      }, 0);
      if (form.hasAttribute("data-waits-for-agent")) {
        var typing = document.getElementById("typing-indicator");
        document.getElementById("typing-text").textContent =
          form.dataset.waitingText || defaultWaitingText;
        form.after(typing);
        typing.hidden = false;
      }
    });
    // Enter sends the message, Shift+Enter starts a new line. requestSubmit() takes
    // the same path as the Send button (validation, the submit handler above).
    document.addEventListener("keydown", function (event) {
      var field = event.target;
      if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
      if (!field.hasAttribute || !field.hasAttribute("data-enter-sends") || !field.form) return;
      event.preventDefault();
      field.form.requestSubmit();
    });
    // Back/forward cache restores the page as it was left: unlock it again.
    window.addEventListener("pageshow", function (event) {
      if (!event.persisted) return;
      document.querySelectorAll("form").forEach(function (f) { delete f.dataset.submitted; });
      document.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
      document.getElementById("typing-indicator").hidden = true;
      document.getElementById("typing-text").textContent = defaultWaitingText;
    });
    // Runs on a normal page load only (a page restored from the back/forward cache
    // does not run its scripts again). requestSubmit() takes the click's path.
    var autoSubmitForm = document.querySelector("form[data-auto-submit]");
    if (autoSubmitForm) {
      autoSubmitForm.requestSubmit();
    }
    if (document.querySelector(".transcript")) {
      window.scrollTo(0, document.body.scrollHeight);
    }
  </script>
</body>
</html>
