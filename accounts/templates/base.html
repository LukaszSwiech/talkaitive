<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TalkAItive{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: block; margin-top: 1rem; }
    input, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; font-size: 1rem; font-family: inherit; }
    button, .button { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; font-size: 1rem; }
    button:disabled { opacity: 0.6; cursor: progress; }
    [hidden] { display: none !important; }
    .error { color: #b00020; }
    .flash { padding: 0.5rem 0.75rem; border-radius: 0.5rem; background: #f1f1f1; }
    .flash.error { background: #fdecee; }
    .notice { padding: 0.75rem; border-radius: 0.5rem; background: #fff6dd; }

    .topics { list-style: none; padding: 0; }
    .topics button { width: 100%; margin-top: 0.5rem; text-align: left; }

    .transcript { display: flex; flex-direction: column; gap: 0.75rem; margin: 1rem 0; }
    .bubble { max-width: 85%; padding: 0.5rem 0.75rem; border-radius: 0.75rem; overflow-wrap: anywhere; }
    .bubble .who { display: block; font-size: 0.75rem; font-weight: 600; opacity: 0.7; }
    .bubble-assistant { align-self: flex-start; background: #eef1f6; }
    .bubble-user { align-self: flex-end; background: #dcf3e4; }
    .actions { display: flex; gap: 0.5rem; align-items: baseline; }

    .typing { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; color: #555; }
    .spinner { width: 1rem; height: 1rem; border: 2px solid #ccc; border-top-color: #555; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  {% for message in messages %}
    <p class="flash {{ message.tags }}">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}

  <div id="typing-indicator" class="typing" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span role="status">Agent is typing…</span>
  </div>
  <script>
    // Convenience only: forms work without JS, and the server rejects double sends.
    document.addEventListener("submit", function (event) {
      var form = event.target;
      if (form.dataset.submitted) { event.preventDefault(); return; }
      form.dataset.submitted = "1";
      // Disable after the browser has read the form data.
      setTimeout(function () {
        document.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
      }, 0);
      if (form.hasAttribute("data-waits-for-agent")) {
        var typing = document.getElementById("typing-indicator");
        form.after(typing);
        typing.hidden = false;
      }
    });
    // Enter sends the message, Shift+Enter starts a new line. requestSubmit() takes
    // the same path as the Send button (validation, the submit handler above).
    document.addEventListener("keydown", function (event) {
      var field = event.target;
      if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
      if (!field.hasAttribute || !field.hasAttribute("data-enter-sends") || !field.form) return;
      event.preventDefault();
      field.form.requestSubmit();
    });
    // Back/forward cache restores the page as it was left: unlock it again.
    window.addEventListener("pageshow", function (event) {
      if (!event.persisted) return;
      document.querySelectorAll("form").forEach(function (f) { delete f.dataset.submitted; });
      document.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
      document.getElementById("typing-indicator").hidden = true;
    });
    if (document.querySelector(".transcript")) {
      window.scrollTo(0, document.body.scrollHeight);
    }
  </script>
</body>
</html>
