[project]
name = "talkaitive"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: pyupgrade, DJ: Django-specific
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "talkaitive.settings_test"
python_files = ["test_*.py"]
pythonpath = ["."]
testpaths = ["tests"]
