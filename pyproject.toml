[project]
name = "talkaitive"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "gunicorn>=26.2.0",
    "openai>=3.24.0",
    "psycopg[binary]>=3.3.6",
    "tzdata>=2026.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["**/migrations/*", "mutants"]  # mutants/: mutmut's working copy

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: pyupgrade, DJ: Django-specific
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "talkaitive.settings_test"
python_files = ["test_*.py"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mutmut]
# All three packages are copied to mutants/ so talkaitive.settings_test imports there;
# only the critical deterministic logic is mutated.
source_paths = ["accounts", "conversations", "talkaitive"]
# pytest-django puts the directory of the nearest manage.py on sys.path. Without a copy
# in mutants/ it finds the repo's own manage.py and the tests import the unmutated code.
also_copy = ["manage.py"]
only_mutate = [
    "accounts/ownership.py",
    "conversations/budget.py",
    "conversations/memory.py",
    "conversations/services.py",
]
