name: CI

# No paths filters: Railway's "Wait for CI" waits on every commit to main, docs-only ones too.
on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on any branch (e.g. checking a phase commit before its PR).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Latest release tags checked on 2026-10-15, pinned to their commit SHAs
      # (a tag can be moved; a SHA cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cache defaults to on for GitHub-hosted runners; uv reads Python 3.14 from .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # SQLite via talkaitive.settings_test; no secrets or network needed.
      - run: uv run pytest
