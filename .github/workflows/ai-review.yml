name: AI review

# The required check on main: the check's name is this job's name, so the job id stays
# `review` and the job gets no `name`. No job-level if either, because a skipped job
# passes a required check. No push trigger, because Railway waits for all workflows on
# a commit. A PR can edit this file, so the owner reads such PRs by hand.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# One group per PR, so a late run cannot overwrite a newer verdict.
concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Red for a fork, never skipped: a fork run has no model key and a read-only
      # token. This runs before checkout, so no fork code is ever checked out or
      # installed.
      - name: Refuse a fork PR
        id: guard
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing: this review runs only for PRs from this repo."
          exit 1

      # A ':' in a label name in a URL path is encoded as %3A.
      - name: Ensure labels exist
        id: ensure-labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ensure_label() {
            local errors
            if errors=$(gh api "repos/$GH_REPO/labels/${1/:/%3A}" 2>&1 >/dev/null); then
              return 0
            fi
            case "$errors" in
              *"HTTP 404"*) ;;
              *)
                printf '%s\n' "$errors" >&2
                return 1
                ;;
            esac
            gh api --method POST "repos/$GH_REPO/labels" -f "name=$1" -f "color=$2" --silent
          }
          ensure_label "ai-cr:passed" "0e8a16"
          ensure_label "ai-cr:failed" "d73a4a"

      # Same SHAs as ci.yml. Depth 2 holds both parents of the merge commit, which is
      # all the script's `git diff HEAD^1 HEAD` needs. With no ref, a pull_request
      # checks out the event's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev

      # The only step with the model key, and it holds no GitHub token. --no-sync stops
      # uv run from reinstalling the dev group.
      - name: Review the diff
        id: review
        timeout-minutes: 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --no-sync python -m scripts.review.run_review --comment-file "$RUNNER_TEMP/ai-review-comment.md"

      # The script writes the comment before the verdict, so a set verdict means the
      # comment exists. The verdict is checked again before it builds a label name.
      - name: Post the comment and the result label
        id: post
        if: steps.review.outputs.verdict != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          delete_label() {
            local errors
            if errors=$(gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/${1/:/%3A}" 2>&1 >/dev/null); then
              return 0
            fi
            case "$errors" in
              *"HTTP 404"*) return 0 ;;
              *)
                printf '%s\n' "$errors" >&2
                return 1
                ;;
            esac
          }
          case "$VERDICT" in
            pass)
              result="ai-cr:passed"
              opposite="ai-cr:failed"
              ;;
            fail)
              result="ai-cr:failed"
              opposite="ai-cr:passed"
              ;;
            *)
              echo "::error::Unexpected verdict from the review step."
              exit 1
              ;;
          esac
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/ai-review-comment.md"
          delete_label "$opposite"
          gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f "labels[]=$result" --silent

      # A pass label from an older commit must not survive a run that could not review
      # the new one. A failed guard means this PR is not ours to touch.
      - name: Remove result labels after a failure
        id: failure-cleanup
        if: failure() && steps.guard.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delete_label() {
            local errors
            if errors=$(gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/${1/:/%3A}" 2>&1 >/dev/null); then
              return 0
            fi
            case "$errors" in
              *"HTTP 404"*) return 0 ;;
              *)
                printf '%s\n' "$errors" >&2
                return 1
                ;;
            esac
          }
          delete_label "ai-cr:passed"
          delete_label "ai-cr:failed"

      # Last, and with no always(): on a reviewed fail no step has failed yet, so the
      # cleanup above stayed out and the comment and the label remain. If an earlier
      # step failed, this is skipped and the job is red anyway. Only an explicit pass
      # ends green, so a review step that exits 0 with no verdict ends red here too.
      - name: Stop on a failed review
        id: stop
        if: steps.review.outputs.verdict != 'pass'
        run: |
          echo "::error::The AI review failed. The PR comment says why."
          exit 1
